<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数式プレビュー</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111624'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Times New Roman, serif' font-size='22' font-weight='600' fill='%238eb4ff'%3ET%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <style>
    :root { --bg:#0f1117; --card:#1a1d27; --border:#2a2e3a; --text:#e8eaed; --muted:#9aa0a6; --accent:#8eb4ff; --math-bg:#22283a; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1c2340 0%, var(--bg) 55%);
      color: var(--text); padding: 32px 20px 48px;
    }
    .wrap { width: 100%; }
    h1 { font-weight: 600; font-size: 1.6rem; margin: 0 0 16px; }
    .input-area {
      display: flex; gap: 12px; align-items: flex-start;
    }
    .input-area textarea {
      flex: 1; min-width: 0; min-height: 140px; resize: vertical;
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px;
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.95rem; line-height: 1.5; outline: none;
    }
    .input-area textarea::placeholder { color: #6d7380; }
    .input-area textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(142,180,255,.18); }
    .toolbar {
      display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
    }
    .toolbar button {
      appearance: none; cursor: pointer; white-space: nowrap;
      background: var(--card); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 8px 14px; font-size: 0.9rem;
      font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      transition: border-color .15s, box-shadow .15s, background .15s, opacity .15s;
    }
    .toolbar button.primary { font-weight: 600; }
    .toolbar button.undo { font-weight: 400; }
    .toolbar button:hover:not(:disabled) {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(142,180,255,.18);
      background: #1e2230;
    }
    .toolbar button:active:not(:disabled) { background: #252a3a; }
    .toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    .preview {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 28px 20px; min-height: 140px; margin-top: 16px;
    }
    .row { display: block; text-align: left; font-size: 1.05rem; line-height: 1.9; margin: 0.35em 0; color: #d5d8e0; }
    .row sub, .row sup { font-size: 0.72em; }
    .math {
      display: flex; align-items: center; gap: 0.15em; text-align: left !important; margin: 0.7em 0;
      padding: 0.72em 1em 0.72em 0.95em; border-radius: 12px; overflow-x: auto;
      background: linear-gradient(90deg, rgba(142,180,255,.95), rgba(142,180,255,.2)) left / 3px 100% no-repeat, var(--math-bg);
      box-shadow: inset 0 0 0 1px rgba(142,180,255,.16);
      color: #f4f7ff; font-size: 1.05rem;
    }
    .math .katex { font-size: 1.28em; color: #f4f7ff; }
    .math .katex-display, .math .katex-display > .katex { display: block; text-align: left !important; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>数式プレビュー</h1>
    <div class="input-area">
      <textarea id="input" placeholder="ここに貼り付けてください"></textarea>
      <div class="toolbar">
        <button type="button" id="btn-sub" class="primary" title="選択した 分子/分母 を縦の分数に変換">総分数化</button>
        <button type="button" id="btn-undo" class="undo" title="直前の変換を取り消す" disabled>元に戻す</button>
      </div>
    </div>
    <div class="preview" id="preview"></div>
  </div>
  <script>
    const input = document.getElementById("input");
    const preview = document.getElementById("preview");
    const btnSub = document.getElementById("btn-sub");
    const btnUndo = document.getElementById("btn-undo");
    const OPS = /[=＝+＋\-−*×÷\/<>＜＞≤≥≦≧≠≈∼≃≡⇒⇔→←↔±∓∈∉⊂⊃⊆⊇∪∩∑∫∏√∞∂∇\\≽≼≻≺⪰⪯≳≲≫≪]/;
    const TEX_OPS = {
      "≽": "\\succcurlyeq ", "≼": "\\preccurlyeq ", "≻": "\\succ ", "≺": "\\prec ",
      "⪰": "\\succeq ", "⪯": "\\preceq ", "≳": "\\gtrsim ", "≲": "\\lesssim ",
      "≫": "\\gg ", "≪": "\\ll ", "≦": "\\leq ", "≧": "\\geq "
    };
    const transforms = [];

    function isJapanese(ch) {
      const c = ch.codePointAt(0);
      return (c >= 0x3040 && c <= 0x30ff) || (c >= 0x4e00 && c <= 0x9fff) ||
        (c >= 0x3001 && c <= 0x303f) || (c >= 0xff01 && c <= 0xff60);
    }
    function looksLikeMath(s) { return OPS.test(s); }

    function toTex(s) {
      let out = "", scriptDepth = 0, i = 0;
      const map = (ch) => TEX_OPS[ch] ?? ch;

      while (i < s.length) {
        const ch = s[i];

        if (ch === "\\") {
          out += "\\";
          i++;
          if (i >= s.length) break;
          if (!/[a-zA-Z]/.test(s[i])) { out += s[i++]; continue; }
          while (i < s.length && /[a-zA-Z]/.test(s[i])) out += s[i++];
          if (i < s.length && s[i] === "*") out += s[i++];
          while (i < s.length && s[i] === "{") {
            out += "{";
            i++;
            for (let depth = 1; i < s.length && depth > 0;) {
              if (s[i] === "\\") {
                out += "\\";
                i++;
                if (i < s.length && !/[a-zA-Z]/.test(s[i])) { out += s[i++]; continue; }
                while (i < s.length && /[a-zA-Z]/.test(s[i])) out += s[i++];
                if (i < s.length && s[i] === "*") out += s[i++];
                continue;
              }
              if (s[i] === "{") { depth++; out += "{"; i++; continue; }
              if (s[i] === "}") { depth--; out += "}"; i++; continue; }
              out += map(s[i++]);
            }
          }
          continue;
        }

        if (ch === "{") {
          if (i > 0 && (s[i - 1] === "_" || s[i - 1] === "^")) { scriptDepth++; out += "{"; }
          else out += "\\{";
          i++;
          continue;
        }
        if (ch === "}") {
          if (scriptDepth > 0) { scriptDepth--; out += "}"; }
          else out += "\\}";
          i++;
          continue;
        }

        out += map(ch);
        i++;
      }
      return out;
    }

    function appendPlain(parent, text) {
      let i = 0, buf = "";
      const flush = () => {
        if (!buf) return;
        parent.appendChild(document.createTextNode(buf));
        buf = "";
      };
      while (i < text.length) {
        if ((text[i] === "_" || text[i] === "^") && text[i + 1] === "{") {
          const close = text.indexOf("}", i + 2);
          if (close !== -1) {
            flush();
            const el = document.createElement(text[i] === "_" ? "sub" : "sup");
            el.textContent = text.slice(i + 2, close);
            parent.appendChild(el);
            i = close + 1;
            continue;
          }
        }
        buf += text[i++];
      }
      flush();
    }

    function nodeToTex(node) {
      if (node.nodeType === Node.TEXT_NODE) return node.textContent;
      if (node.nodeType !== Node.ELEMENT_NODE) return "";
      const tag = node.tagName.toLowerCase();
      const enc = node.getAttribute("encoding") || "";
      if (tag === "annotation" && /tex/i.test(enc)) return node.textContent.trim();
      if (tag === "script" && /math\/tex/i.test(node.type || "")) return node.textContent.trim();
      if (tag === "math") {
        const ann = node.querySelector("annotation[encoding*='tex']");
        if (ann) return ann.textContent.trim();
      }
      const inner = [...node.childNodes].map(nodeToTex).join("");
      if (tag === "sub") return "_{" + inner + "}";
      if (tag === "sup") return "^{" + inner + "}";
      if (tag === "br" || tag === "p" || tag === "div") return inner + "\n";
      return inner;
    }

    function htmlToTex(html) {
      const doc = new DOMParser().parseFromString(html, "text/html");
      const anns = [...doc.querySelectorAll("annotation[encoding*='tex'], script[type*='math/tex']")];
      if (anns.length) return anns.map((n) => n.textContent.trim()).filter(Boolean).join("\n\n");
      return nodeToTex(doc.body).replace(/\n{2,}/g, "\n").trim();
    }

    function segment(line) {
      const parts = [];
      let buf = "", mode = null;
      const push = () => { if (buf) parts.push({ type: mode, text: buf }); buf = ""; };
      for (const ch of line) {
        const next = ch === "（" || ch === "）" || isJapanese(ch) ? "ja" : "other";
        if (mode && next !== mode) push();
        mode = next;
        buf += ch;
      }
      push();
      return parts.map((p) =>
        p.type === "other" && looksLikeMath(p.text) ? { type: "math", text: p.text } : { type: "ja", text: p.text }
      );
    }

    function blocksOf(line) {
      const out = [];
      let depth = 0, buf = "";
      const push = (kind) => { if (buf) out.push({ kind, text: buf }); buf = ""; };
      for (const ch of line) {
        if (ch === "（") { if (depth === 0) push("out"); depth++; buf += ch; }
        else if (ch === "）" && depth > 0) { buf += ch; depth--; if (depth === 0) push("in"); }
        else buf += ch;
      }
      push(depth > 0 ? "in" : "out");
      return out.filter((b) => b.text.trim());
    }

    function addMath(parent, tex, display, suffix) {
      const el = document.createElement(display ? "div" : "span");
      if (display) el.className = "math";
      katex.render(toTex(tex.trim()), el, { throwOnError: false, displayMode: display });
      el.querySelectorAll(".katex-display").forEach((n) => {
        n.style.textAlign = "left";
        n.style.margin = "0";
      });
      if (suffix) el.appendChild(document.createTextNode(suffix));
      parent.appendChild(el);
    }

    function renderInline(parent, text) {
      for (const seg of segment(text)) {
        if (seg.type === "math") addMath(parent, seg.text, false);
        else appendPlain(parent, seg.text);
      }
    }

    function applyTransforms(raw) {
      let text = raw;
      for (const t of [...transforms].sort((a, b) => b.start - a.start)) {
        if (t.start < 0 || t.end > text.length || text.slice(t.start, t.end) !== t.orig) continue;
        const sel = text.slice(t.start, t.end);
        const slash = sel.indexOf("/");
        if (slash <= 0 || slash >= sel.length - 1) continue;
        const num = sel.slice(0, slash);
        const den = sel.slice(slash + 1);
        if (!num.trim() || !den.trim()) continue;
        text = text.slice(0, t.start) + "\\frac{" + num + "}{" + den + "}" + text.slice(t.end);
      }
      return text;
    }

    function render() {
      preview.innerHTML = "";
      btnUndo.disabled = transforms.length === 0;
      const raw = input.value.replace(/&lt;/g, "<").replace(/&gt;/g, ">");
      if (!raw.trim()) return;

      for (const line of applyTransforms(raw).split(/\r?\n/)) {
        if (!line.trim()) continue;
        let pending = null;
        const flush = () => { if (pending) { preview.appendChild(pending); pending = null; } };
        const row = () => {
          if (!pending) { pending = document.createElement("div"); pending.className = "row"; }
          return pending;
        };

        for (const block of blocksOf(line)) {
          if (block.kind === "in") { renderInline(row(), block.text); continue; }
          const segs = segment(block.text);
          for (let i = 0; i < segs.length; i++) {
            const seg = segs[i];
            if (!seg.text) continue;
            if (seg.type === "math") {
              flush();
              let suffix = "";
              const next = segs[i + 1], after = segs[i + 2];
              if (next && next.type !== "math" && next.text.startsWith("；")) {
                suffix = "；";
                next.text = next.text.slice(1);
              } else if (next && next.type !== "math" && next.text.startsWith("、") && after && after.type === "math") {
                suffix = "、";
                next.text = next.text.slice(1);
              }
              addMath(preview, seg.text, true, suffix);
            } else {
              appendPlain(row(), seg.text);
            }
          }
        }
        flush();
      }
    }

    function isFractionSelection(text) {
      const slash = text.indexOf("/");
      if (slash <= 0 || slash >= text.length - 1) return false;
      return !!(text.slice(0, slash).trim() && text.slice(slash + 1).trim());
    }

    /** ボタン操作後も textarea の選択（反転）を維持する */
    function restoreSelection(start, end) {
      input.focus();
      input.setSelectionRange(start, end);
    }

    // ボタンへのフォーカス移動を防ぎ、選択が消えないようにする
    btnSub.addEventListener("mousedown", (e) => e.preventDefault());
    btnUndo.addEventListener("mousedown", (e) => e.preventDefault());

    btnSub.addEventListener("click", () => {
      const start = input.selectionStart, end = input.selectionEnd;
      if (start === end) return;
      const text = input.value.slice(start, end);
      if (!isFractionSelection(text)) {
        restoreSelection(start, end);
        return;
      }
      const i = transforms.findIndex((t) => t.start === start && t.end === end);
      const entry = { start, end, orig: text };
      if (i >= 0) transforms[i] = entry;
      else transforms.push(entry);
      render();
      restoreSelection(start, end);
    });

    btnUndo.addEventListener("click", () => {
      const start = input.selectionStart, end = input.selectionEnd;
      if (!transforms.length) {
        restoreSelection(start, end);
        return;
      }
      transforms.pop();
      render();
      restoreSelection(start, end);
    });

    input.addEventListener("paste", (e) => {
      const html = e.clipboardData && e.clipboardData.getData("text/html");
      if (html && /sub|sup|annotation|math\/tex|<math/i.test(html)) {
        e.preventDefault();
        transforms.length = 0;
        input.value = htmlToTex(html);
        render();
      } else {
        transforms.length = 0;
        setTimeout(render, 0);
      }
    });
    input.addEventListener("input", () => {
      transforms.length = 0;
      render();
    });
  </script>
</body>
</html>
